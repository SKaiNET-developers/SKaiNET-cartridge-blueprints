[versions]
# Kotlin follows the pinned SKaiNET release rather than moving on its own: 0.62.1 is compiled with
# 2.4.21, and reading KMP metadata written by a newer Kotlin than the consumer uses does not work.
# The blueprint plugin's own build script hard-codes the same version twice — keep all three in step.
kotlin = "2.4.21"
kotlinxSerializationJson = "1.11.0"
jsonSchemaValidator = "0.5.5"
# SKaiNET core and skainet-transformers move together: a transformers release carries at least the engine's
# minor and may advance its own patch (0.62.2 is a transformers-only fix against engine 0.61.0).
skainet = "0.62.1"
transformers = "0.63.0"
agp = "9.4.1"
androidCompileSdk = "36"
androidMinSdk = "29"
kotlinxCoroutines = "1.11.0"
kotlinxIo = "0.9.1"
# SKaiNET-audio: Whisper's log-mel frontend for the Whisper binding
skainetAudio = "0.2.2"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
skainet-data-source = { module = "sk.ainet.core:skainet-data-source", version.ref = "skainet" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
audio-mel = { module = "sk.ainet.audio:audio-mel", version.ref = "skainetAudio" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
optimumcode-json-schema-validator = { module = "io.github.optimumcode:json-schema-validator", version.ref = "jsonSchemaValidator" }
transformers-bom = { module = "sk.ainet.transformers:skainet-transformers-bom", version.ref = "transformers" }
transformers-core = { module = "sk.ainet.transformers:skainet-transformers-core" }
transformers-agent = { module = "sk.ainet.transformers:skainet-transformers-agent" }
transformers-runtime-gemma-iree = { module = "sk.ainet.transformers:skainet-transformers-runtime-gemma-iree" }
transformers-runtime-iree-android = { module = "sk.ainet.transformers:skainet-transformers-runtime-iree-android" }
transformers-inference-moonshine = { module = "sk.ainet.transformers:skainet-transformers-inference-moonshine" }
transformers-inference-whisper = { module = "sk.ainet.transformers:skainet-transformers-inference-whisper" }
transformers-inference-functiongemma = { module = "sk.ainet.transformers:skainet-transformers-inference-functiongemma", version.ref = "transformers" }
transformers-inference-qwen = { module = "sk.ainet.transformers:skainet-transformers-inference-qwen", version.ref = "transformers" }
skainet-io-core = { module = "sk.ainet.core:skainet-io-core", version.ref = "skainet" }
skainet-io-gguf = { module = "sk.ainet.core:skainet-io-gguf", version.ref = "skainet" }
skainet-backend-cpu = { module = "sk.ainet.core:skainet-backend-cpu", version.ref = "skainet" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
