group=sk.ainet.cartridge
version=0.1.0-SNAPSHOT

# Published cartridge artifacts (the modules that apply vanniktech maven-publish): one shared
# release version, same scheme as SKaiNET-transformers — a tag push publishes to Maven Central.
VERSION_NAME=0.2.0

POM_DESCRIPTION=SKaiNET cartridge artifacts: task-profile contracts and blueprint consumer libraries
POM_URL=https://github.com/SKaiNET-developers/SKaiNET-cartridge-blueprints/
POM_SCM_URL=https://github.com/SKaiNET-developers/SKaiNET-cartridge-blueprints
POM_SCM_CONNECTION=scm:git:git@github.com:SKaiNET-developers/SKaiNET-cartridge-blueprints.git
POM_SCM_DEV_CONNECTION=scm:git:ssh@github.com:SKaiNET-developers/SKaiNET-cartridge-blueprints.git
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://mit-license.org/
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=SKaiNET-developers
POM_DEVELOPER_NAME=SKaiNET development team
POM_DEVELOPER_URL=https://github.com/SKaiNET-developers/

signAllPublications=true
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=false

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

android.useAndroidX=true
kotlin.mpp.applyDefaultHierarchyTemplate=true
kotlin.code.style=official
